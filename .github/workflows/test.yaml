name: Automated Tests

on: [pull_request]

jobs:
  jest:
    name: Jest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm i

      - name: Run tests
        run: npm test
